<ion-header>
  <ion-toolbar color="primary">
    <ion-title>EduSync Admin</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="container d-flex justify-content-center align-items-center h-100" style="min-height: 80vh;">
    
    <ion-card class="w-100 shadow" style="max-width: 400px;">
      <ion-card-content>
        <div class="text-center mb-4">
          <h2>Bienvenido</h2>
          <p class="text-muted">Ingresa tus credenciales de administrador</p>
        </div>

        <form [formGroup]="loginForm" (ngSubmit)="OnSubmit()">
          
          <div class="mb-3">
            <ion-input 
              label="Correo Institucional" 
              label-placement="floating" 
              fill="outline" 
              formControlName="email" 
              type="email" 
              placeholder="correo">
            </ion-input>
          </div>

          <div class="mb-3">
            <ion-input 
              label="Contraseña" 
              label-placement="floating" 
              fill="outline" 
              formControlName="password" 
              type="password">
            </ion-input>
          </div>

          <div *ngIf="errorMessage" class="alert alert-danger text-center p-2 mb-3">
            {{ errorMessage }}
          </div>

          <ion-button expand="block" type="submit" [disabled]="loginForm.invalid || isLoading">
            {{ isLoading ? 'Verificando...' : 'Iniciar Sesión' }}
          </ion-button>

        </form>
      </ion-card-content>
    </ion-card>

  </div>
</ion-content>
